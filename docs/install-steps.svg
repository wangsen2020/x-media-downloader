<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="270" rx="16" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f1419">Install in 4 steps</text>
  <text x="32" y="68" font-size="13" fill="#536471">Chrome 116+ / Edge 116+ &#183; no build, no Web Store needed</text>

  <!-- connectors -->
  <g stroke="#1d9bf0" stroke-width="2" fill="none" opacity="0.5">
    <path d="M244 175 h44"/><path d="M476 175 h44"/><path d="M708 175 h44"/>
  </g>
  <g fill="#1d9bf0" opacity="0.5">
    <path d="M288 175 l-9 -5 v10 z"/><path d="M520 175 l-9 -5 v10 z"/><path d="M752 175 l-9 -5 v10 z"/>
  </g>

  <!-- Step 1 -->
  <g>
    <rect x="32" y="96" width="212" height="158" rx="12" fill="#f7f9f9" stroke="#e3e8ea"/>
    <circle cx="56" cy="120" r="14" fill="#1d9bf0"/>
    <text x="56" y="125" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="80" y="125" font-size="14" font-weight="700" fill="#0f1419">Open the page</text>
    <text x="52" y="162" font-size="12.5" fill="#0f1419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chrome://extensions</text>
    <text x="52" y="182" font-size="12" fill="#536471">Edge:</text>
    <text x="88" y="182" font-size="12.5" fill="#0f1419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">edge://extensions</text>
    <text x="52" y="222" font-size="11.5" fill="#536471">Paste it in the address</text>
    <text x="52" y="238" font-size="11.5" fill="#536471">bar and press Enter.</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="264" y="96" width="212" height="158" rx="12" fill="#f7f9f9" stroke="#e3e8ea"/>
    <circle cx="288" cy="120" r="14" fill="#1d9bf0"/>
    <text x="288" y="125" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="312" y="125" font-size="14" font-weight="700" fill="#0f1419">Developer mode</text>
    <text x="284" y="158" font-size="11.5" fill="#536471">Top-right corner of the</text>
    <text x="284" y="174" font-size="11.5" fill="#536471">page &#8212; flip it on.</text>
    <rect x="284" y="192" width="150" height="34" rx="17" fill="#fff" stroke="#e3e8ea"/>
    <text x="296" y="213" font-size="11.5" fill="#0f1419">Developer mode</text>
    <rect x="400" y="199" width="26" height="16" rx="8" fill="#1d9bf0"/>
    <circle cx="418" cy="207" r="6" fill="#fff"/>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="496" y="96" width="212" height="158" rx="12" fill="#f7f9f9" stroke="#e3e8ea"/>
    <circle cx="520" cy="120" r="14" fill="#1d9bf0"/>
    <text x="520" y="125" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="544" y="125" font-size="14" font-weight="700" fill="#0f1419">Load unpacked</text>
    <rect x="516" y="142" width="172" height="30" rx="15" fill="#fff" stroke="#1d9bf0"/>
    <text x="602" y="161" font-size="11.5" fill="#1d9bf0" text-anchor="middle">Load unpacked</text>
    <text x="516" y="196" font-size="11.5" fill="#536471">Pick the folder that</text>
    <text x="516" y="212" font-size="11.5" fill="#536471">contains</text>
    <text x="576" y="212" font-size="11.5" fill="#0f1419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">manifest.json</text>
    <text x="516" y="234" font-size="11.5" fill="#536471">(the repo root).</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="728" y="96" width="200" height="158" rx="12" fill="#f7f9f9" stroke="#e3e8ea"/>
    <circle cx="752" cy="120" r="14" fill="#1d9bf0"/>
    <text x="752" y="125" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="776" y="125" font-size="14" font-weight="700" fill="#0f1419">Pin &amp; go</text>
    <!-- puzzle + pin -->
    <path d="M760 150h14a4 4 0 0 1 4 4v6a5 5 0 0 0 10 0v-6a4 4 0 0 1 4-4h6v34h-34a4 4 0 0 1-4-4v-6a5 5 0 0 0-10 0v6a4 4 0 0 1-4 4h-2v-34h10z" fill="#1d9bf0" opacity="0.85"/>
    <text x="812" y="170" font-size="11.5" fill="#536471">Click the puzzle</text>
    <text x="812" y="186" font-size="11.5" fill="#536471">icon, pin</text>
    <text x="760" y="214" font-size="11.5" fill="#536471">The options / history</text>
    <text x="760" y="230" font-size="11.5" fill="#536471">page opens on install.</text>
  </g>
</svg>
