  <text x="90" y="209" fill="#b8c7d3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24">Download X / Twitter videos, GIFs and images — locally in your browser.</text>
