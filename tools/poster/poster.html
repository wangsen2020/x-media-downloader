<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localized promo poster</title><link rel="stylesheet" href="poster.css"></head>
<body><main id="poster">
  <img class="scene" src="scene.jpg" alt=""><div class="overlay"></div>
  <div class="copy"><div class="headline headline1" data-copy="headline1"></div><div class="headline headline2" data-copy="headline2"></div>
    <div class="sub" data-copy="sub"></div><div class="pill" data-copy="pill"></div>
    <ul class="bullets"><li data-copy="bullet1"></li><li data-copy="bullet2"></li><li data-copy="bullet3"></li></ul>
    <div class="badge" data-copy="badge"></div>
  </div>
  <div class="popup-card"><iframe title="Extension popup" scrolling="no"></iframe></div>
  <div class="steps"><div class="step"><div class="number">1</div><div class="step-label" data-copy="step1"></div></div><div class="step"><div class="number">2</div><div class="step-label" data-copy="step2"></div></div><div class="step"><div class="number">3</div><div class="step-label" data-copy="step3"></div></div></div>
</main><script type="module" src="poster.js"></script></body></html>
