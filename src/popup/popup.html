<!doctype html>
<html lang="en" dir="__MSG_@@bidi_dir__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">X Media Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pp-head">
      <div class="pp-brand">
        <img src="../../icons/icon48.png" alt="" width="22" height="22" />
        <span data-i18n="popupTitle">X Media Downloader</span>
      </div>
      <button id="openOptions" class="pp-icon-btn" title="History &amp; settings" data-i18n-title="popupOpenOptions" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <a
      id="promoBar"
      class="pp-promo-bar"
      href="https://chromewebstore.google.com/detail/xfollower-follower-manage/dbokihddfeclflabcnjggminlkdfjfjf?utm_source=xdown&utm_medium=popup&utm_campaign=crosspromo"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="pp-promo-badge" data-i18n="popupPromoBadge">XFollower</span>
      <span class="pp-promo-text" data-i18n="popupPromoText">Manage X followers &amp; track unfollowers</span>
      <span class="pp-promo-cta" aria-hidden="true">↗</span>
    </a>

    <main class="pp-body">
      <section id="batch" class="pp-batch" hidden>
        <button id="batchDownload" class="pp-primary" type="button"></button>
        <p id="batchStatus" class="pp-status" role="status"></p>
      </section>

      <section id="detected" hidden>
        <div class="pp-tweet">
          <img id="poster" class="pp-poster" alt="" hidden />
          <div class="pp-tweet-meta">
            <div id="tweetUser" class="pp-user"></div>
            <a id="tweetLink" class="pp-link" target="_blank" rel="noreferrer" data-i18n="popupOpenTweet">open tweet ↗</a>
          </div>
        </div>

        <label class="pp-field">
          <span data-i18n="popupQuality">Quality</span>
          <select id="quality"></select>
        </label>

        <button id="download" class="pp-primary" type="button" data-i18n="popupDownloadVideo">Download video</button>
        <p id="status" class="pp-status" role="status"></p>
      </section>

      <section id="empty" class="pp-empty" hidden>
        <p data-i18n="popupEmpty">Open a tweet (or a timeline) that contains a video, then click the extension again.</p>
        <p class="pp-muted" data-i18n="popupEmptyTip">Tip: a Download button also appears under every video in the feed.</p>
      </section>
    </main>

    <section class="pp-recent">
      <div class="pp-recent-head">
        <span data-i18n="popupRecent">Recent downloads</span>
        <button id="viewAll" class="pp-textlink" type="button" data-i18n="popupViewAll">View all</button>
      </div>
      <ul id="recentList" class="pp-recent-list"></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
